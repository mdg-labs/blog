name: Bug report
description: Something in @mdg-labs/blog isn't working as expected.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more of this you can
        fill in, the faster it can be triaged and reproduced.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact steps, in order, that trigger this.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.3.1 or commit 4bdc7e6
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where it runs — OS, deployment, anything relevant to the bug.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Relevant output. Remove secrets and tokens before pasting.
      render: text
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Best guess is fine — triage will confirm or correct it.
      options:
        - area:package (packages/blog — the published @mdg-labs/blog package)
        - area:consumer (Consumer integration: README manual, templates, consumers/claude-rule.md)
        - area:ci (GitHub workflows and publishing)
        - not sure
    validations:
      required: false
